image: maven:3.9-eclipse-temurin-21

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

# Cacht Maven-Abhängigkeiten, damit der Build schneller geht
cache:
  paths:
    - .m2/repository/

stages:
  - build
  - test

build_job:
  stage: build
  script:
    - ./mvnw compile

test_job:
  stage: test
  services:
    - name: postgres:17
      alias: postgres
  script:
    - ./mvnw test
  variables:
    SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/learning_management_system"
    SPRING_DATASOURCE_USERNAME: "postgres"
    SPRING_DATASOURCE_PASSWORD: "postgres"
    POSTGRES_DB: "learning_management_system"
    POSTGRES_USER: "postgres"
    POSTGRES_PASSWORD: "postgres"