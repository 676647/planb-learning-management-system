# nginx in the "web" container: serves the built React app and forwards /api to Spring Boot.
# The browser only ever talks to this one server (same origin), just like the Vite dev proxy.

server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads (hand-in files) – nginx allows only 1 MB by default; Spring allows 25 MB per request
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Docker's internal DNS. Looking the backend up per request (instead of once at startup)
    # means nginx starts even if the backend isn't up yet, and keeps working if it restarts.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;   # includes the port, so Spring sees it's the same origin
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have a hash in their name (index-DQsiyNTA.js), so they can be cached for long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the single-page app; index.html must never be cached,
    # so users get the new version right after a deployment
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }
}
