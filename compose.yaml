services:
  web:
    container_name: learningManagementSystem
    image: nginx:alpine
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    restart: unless-stopped

  # Databases and message broker for development. Start them (not the web service above) with:
  #   docker compose up -d postgres mongo rabbitmq
  # Data is kept in Docker volumes, so it survives restarts.
  # Remove everything (including data) with:  docker compose down -v

  # PostgreSQL: the relational database (users, courses, submissions, grades, ...)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms     # development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # MongoDB: the NoSQL store; uploaded files are kept in its GridFS
  mongo:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  # RabbitMQ: message broker for domain events (exchange "lms.events")
  # Management UI: http://localhost:15672 (login lms / lms) – see exchanges, queues and messages
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      # The default "guest" user may only connect from inside the container, so create our own
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms     # development only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  rabbitmq-data:
