services:
  web:
    container_name: learningManagementSystem
    image: nginx:alpine
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
    restart: unless-stopped
    networks:
      - learning-management-network

  postgres:
    container_name: learningManagementSystemPostgres
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: learning_management_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - learning-management-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d learning_management_system"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  learning-management-network:
    driver: bridge
