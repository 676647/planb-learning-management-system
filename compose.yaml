# The whole system in Docker – see DEPLOYMENT.md.
#
#   Everything:            docker compose up -d --build      → http://localhost:8080
#   Only the services for local development (backend and frontend run from IntelliJ / npm):
#                          docker compose up -d postgres mongo rabbitmq
#   Stop:                  docker compose down               (data is kept in volumes)
#   Stop and delete data:  docker compose down -v
#
#            browser
#               │ :8080
#          ┌────▼────┐   /api/*   ┌─────────┐
#          │   web   ├───────────►│ backend │──► postgres, mongo, rabbitmq
#          │ (nginx) │            │ (Spring)│
#          └─────────┘            └─────────┘

services:
  # React frontend served by nginx, which forwards /api to the backend (frontend/nginx.conf)
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Spring Boot backend (Dockerfile in the project root). Not published on the host:
  # browsers and API clients reach it through web, at http://localhost:8080/api/...
  backend:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/lms
      DB_USER: lms
      DB_PASSWORD: lms
      MONGODB_URI: mongodb://mongo:27017/lms?serverSelectionTimeoutMS=5000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: lms
      RABBITMQ_PASSWORD: lms
      # The first admin (decides who is a teacher). Change the password, e.g. in a .env file
      LMS_ADMIN_EMAIL: ${LMS_ADMIN_EMAIL:-admin@lms.local}
      LMS_ADMIN_PASSWORD: ${LMS_ADMIN_PASSWORD:-admin-password}
      # For a real deployment, put a long random JWT_SECRET in a .env file next to this file
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-change-me-0123456789abcdef}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  # PostgreSQL: the relational database (users, courses, submissions, grades, ...)
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lms
      POSTGRES_USER: lms
      POSTGRES_PASSWORD: lms     # development only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lms -d lms"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s   # grace period while the container starts (e.g. during image builds)
    restart: unless-stopped

  # MongoDB: the NoSQL store; uploaded files are kept in its GridFS
  # Version 9.0 on purpose: MongoDB 8.0 refuses to start on Linux kernel 6.19+ (SERVER-121912),
  # which newer Docker Desktop versions use. 9.0 is not affected.
  mongo:
    image: mongo:9.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb   # the mongo image declares this volume too; named so no anonymous volume is created
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 15s        # mongosh takes a few seconds to start on a busy machine
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # RabbitMQ: message broker for domain events (exchange "lms.events")
  # Management UI: http://localhost:15672 (login lms / lms) – see exchanges, queues and messages
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      # The default "guest" user may only connect from inside the container, so create our own
      RABBITMQ_DEFAULT_USER: lms
      RABBITMQ_DEFAULT_PASS: lms     # development only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 40s
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
  rabbitmq-data:
