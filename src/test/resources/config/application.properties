# Test-only settings. Spring Boot loads this file IN ADDITION to src/main/resources/application.properties
# (files in a config/ folder take precedence), so only the differences are listed here.
# Tests run without Docker: H2 in memory instead of PostgreSQL, files in memory instead of MongoDB.

spring.datasource.url=jdbc:h2:mem:lms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

lms.storage.type=memory
# Domain events are delivered in-process after commit instead of through RabbitMQ
lms.messaging.type=local
# Don't connect to MongoDB or RabbitMQ at all in tests
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration,\
  org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# An admin account for the tests (AccountApiTests logs in with it)
lms.admin.email=admin@test.local
lms.admin.password=admin-password

# No test data: the tests create their own (DemoDataLoaderTests turns it on for itself)
lms.demo-data.enabled=false
