spring.application.name=myapp
server.port=8080
management.endpoints.web.exposure.include=health

spring.datasource.url=jdbc:postgresql://${user}:${password}@ep-sparkling-smoke-b5ht37u5-pooler.c-7.us-east-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require\
spring.datasource.username=${user}
spring.datasource.password=${password}

# use of PostgreSQL Driver
spring.datasource.driver-class-name=org.postgresql.Driver

# automatic update through java classes
spring.jpa.hibernate.ddl-auto=update

# Optional: SQL-Befehle im Log anzeigen (hilfreich fürs Debugging)
spring.jpa.show-sql=true
