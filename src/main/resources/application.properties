spring.application.name=myapp
server.port=8080
management.endpoints.web.exposure.include=health

# --- H2 in-memory database (data is reset on every restart) ---
spring.datasource.url=jdbc:h2:mem:lms;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Web console at http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# --- Security ---
# Secret used to sign login tokens (HS256, at least 32 characters).
# The default is for local development only; set JWT_SECRET in production.
lms.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
lms.jwt.ttl-minutes=60
# Frontend origins allowed to call the API from a browser (React dev servers)
lms.cors.allowed-origins=http://localhost:5173,http://localhost:3000

