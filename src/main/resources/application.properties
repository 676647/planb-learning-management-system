spring.application.name=myapp
server.port=8080
management.endpoints.web.exposure.include=health

# Start the databases first:  docker compose up -d postgres mongo
# Tests don't need them: they use H2 and in-memory file storage
# (see src/test/resources/config/application.properties).

# --- PostgreSQL: the relational database (users, courses, submissions, grades, ...) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/lms}
spring.datasource.username=${DB_USER:lms}
spring.datasource.password=${DB_PASSWORD:lms}
# Hibernate creates and updates tables from the entity classes; data is kept between restarts.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# --- MongoDB: the NoSQL store; uploaded files are kept in its GridFS ---
# Only file metadata is kept in PostgreSQL. serverSelectionTimeoutMS makes requests fail
# after 5 s (instead of 30 s) when MongoDB is not running.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/lms?serverSelectionTimeoutMS=5000}
# "gridfs" = MongoDB, "memory" = keep files in memory (lost on restart; for running without MongoDB)
lms.storage.type=${STORAGE_TYPE:gridfs}
# Which files students may upload
lms.storage.allowed-extensions=pdf,doc,docx,odt,txt,md,zip,png,jpg,jpeg
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# --- RabbitMQ: domain events (exchange "lms.events"); management UI on http://localhost:15672 ---
# "rabbit" = send events through RabbitMQ; "local" = deliver them in-process (tests, or no RabbitMQ)
lms.messaging.type=${MESSAGING_TYPE:rabbit}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:lms}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:lms}
# If a listener fails, try 3 times, then move the message to the dead-letter queue (no endless redelivery)
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# --- Security ---
# Secret used to sign login tokens (HS256, at least 32 characters).
# The default is for local development only; set JWT_SECRET in production.
lms.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
lms.jwt.ttl-minutes=60
# The first admin, created on startup if the account doesn't exist yet (see AdminBootstrap).
# Admins decide who is a teacher; only teachers and admins can create courses.
# The defaults are for local development only: set LMS_ADMIN_PASSWORD (and LMS_ADMIN_EMAIL) in production.
lms.admin.email=${LMS_ADMIN_EMAIL:admin@lms.local}
lms.admin.password=${LMS_ADMIN_PASSWORD:admin-password}
lms.admin.name=${LMS_ADMIN_NAME:Administrator}
# Test data (users, courses, modules, quizzes) from src/main/resources/demo-data.json, inserted on
# startup into a database that doesn't have it yet (see DemoDataLoader). Set DEMO_DATA=false to skip it.
lms.demo-data.enabled=${DEMO_DATA:true}
# Frontend origins allowed to call the API from a browser (React dev servers)
lms.cors.allowed-origins=http://localhost:5173,http://localhost:3000
